
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>

    <!-- CSS Tailwind -->
    <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-slate-950 text-white">

    <main class="p-6">

        <section>
            <p class="bg-orange-500 text-black p-2 rounded-lg inline-block">
                Nuevo · Jueves a sábado
            </p>

            <h1 class="text-5xl font-bold mt-6">
                Rueda <span class="text-orange-400">Nocturna</span>
            </h1>

            <p class="text-gray-300 text-lg mt-4">
                Descubre Medellín en bici cuando se encienden las luces
            </p>

            <div class="mt-8">
                <p class="text-2xl font-bold">3 rutas</p>
                <p class="text-2xl font-bold mt-2">Desde $55.000</p>
            </div>

            <a href="#" class="inline-block bg-orange-500 text-black p-4 rounded-lg mt-6">
                Inscríbete
            </a>
        </section>

        
        <!-- Botones Tailwind-->
        <section class="mt-12">
            <h2 class="text-2xl font-bold mb-6">
                Botones
            </h2>

            <div class="flex flex-wrap gap-4">
                <!-- Boton principal -->
                <button type="button"
                    class="bg-orange-500 text-black p-3 rounded-lg hover:bg-orange-400 focus-visible:ring-2 focus-visible:ring-orange-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
                    Botón principal
                </button>

                <!-- Boton secundario -->
                <button type="button"
                    class="bg-slate-700 text-white p-3 rounded-lg hover:bg-slate-600 focus-visible:ring-2 focus-visible:ring-orange-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
                    Botón secundario
                </button>

                <!-- Boton de contorno -->
                <button type="button"
                    class="border border-orange-500 text-orange-400 p-3 rounded-lg hover:bg-orange-500 hover:text-black focus-visible:ring-2 focus-visible:ring-orange-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
                    Botón de contorno
                </button>
            </div>

        </section>


    </main>

</body>
</html>
